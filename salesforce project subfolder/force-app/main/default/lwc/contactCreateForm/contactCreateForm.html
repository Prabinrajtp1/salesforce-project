<template>
    <lightning-card title="Contact Creation Form" icon-name="standard:Account">
        <div class="slds-var-p-horizontal_medium">
            <lightning-record-edit-form object-api-name="Contact" onsubmit={handleSubmit} onsuccess={handleSuccess}
                onerror={handleError}>
                <lightning-messages></lightning-messages>

                <lightning-input-field field-name="FirstName"></lightning-input-field>
                <lightning-input-field field-name="LastName" required></lightning-input-field>
                <lightning-input-field field-name="Phone"></lightning-input-field>
                <lightning-input-field field-name="AccountId" value={recordId} disabled></lightning-input-field>

                <div class="slds-var-m-top_medium">
                    <lightning-button type="submit" label="Create Contact" variant="brand"></lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
