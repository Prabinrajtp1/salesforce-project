<template>
    <lightning-input type="checkbox" label="Show details" onchange={statusChanged}>
    </lightning-input>

    <template if:true={flag}>
        <lightning-card title="Employee Details">
            <div class="slds-var-p-around_small">
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">First Name</th>
                            <th scope="col">Last Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Phone</th>
                            <th scope="col">Rank</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={employees} for:item="emp">
                            <tr key={emp.Id}>
                                <td>{emp.FirstName}</td>
                                <td>{emp.LastName}</td>
                                <td>{emp.Email}</td>
                                <td>{emp.Phone}</td>
                                <td>{emp.Rank}</td>

                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </lightning-card>
    </template>

    <template if:false={flag}>
        <div class="slds-var-p-around_small">
            If you want to show details, please select the Show details checkbox.
        </div>
    </template>
</template>
