<template>
    <lightning-card title="Account Details" icon-name="standard:account">
        <div class="slds-p-horizontal_small">
            <p><strong>Name:</strong> {accountName}</p>
            <p><strong>Phone:</strong> {accountPhone}</p>
            <p><strong>Industry:</strong> {accountIndustry}</p>
            <p><strong>Billing City:</strong> {accountBillingCity}</p>
        </div>
    </lightning-card>

    <lightning-card title="Contacts" icon-name="standard:contact" class="slds-m-top_medium">
        <div class="slds-p-horizontal_small">
            <template lwc:if={hasContacts}>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">Name</th>
                            <th scope="col">Title</th>
                            <th scope="col">Email</th>
                            <th scope="col">Phone</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={contacts} for:item="con">
                            <tr key={con.Id}>
                                <td>{con.Name}</td>
                                <td>{con.Title}</td>
                                <td>{con.Email}</td>
                                <td>{con.Phone}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template lwc:else>
                <p>No contacts found for this account.</p>
            </template>
        </div>
    </lightning-card>
</template>
