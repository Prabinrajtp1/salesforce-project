<template>
    <lightning-card title="Related Contacts" icon-name="standard:contact">

        <div class="slds-p-around_medium">

            <template lwc:if={contacts.length}>

                <lightning-datatable key-field="Id" data={contacts} columns={columns} hide-checkbox-column>
                </lightning-datatable>

            </template>

            <template lwc:else>
                <p>No Contacts found for this Account.</p>
            </template>

        </div>

    </lightning-card>
</template>
